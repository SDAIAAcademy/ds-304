<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-24T17:56:03Z","version":"2027.2.0","commit":"6daea74"},"course":{"id":"ds-304","code":"DS-304","title":"Forecasting and Time Series","track":"data-science","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/ds-304/","repo":"SDAIAAcademy/ds-304","home":"index.html","outcomes":[{"id":"LO1","text":"Apply decomposition and a seasonal-naive benchmark floor scored by rolling-origin cross-validation, given regional daily demand with weekly and annual seasonality"},{"id":"LO2","text":"Implement exponential smoothing, ARIMA-family and dynamic regression models with temperature and moving-holiday terms, given the regional series and a Hijri and Gregorian calendar"},{"id":"LO3","text":"Measure point and quantile accuracy of a global boosted model and a pretrained zero-shot forecaster against statistical models, given 400 feeder series with eight weeks held out"},{"id":"LO4","text":"Review a forecast evaluation for leakage across time and selection on the test window, and correct it, given a notebook with three seeded faults"},{"id":"LO5","text":"Build a forecasting analysis for new series and defend method, horizon and uncertainty to a planner, given a supplied dataset and a planner's request"}],"unit":"day","units":[{"n":1,"id":"day1","label":"Day 1","title":"Look, frame and set the floor","sessions":[{"n":1,"label":"Session 1","title":"What is forecast, and why"},{"n":2,"label":"Session 2","title":"Seeing structure"},{"n":3,"label":"Session 3","title":"Decomposition"},{"n":4,"label":"Session 4","title":"The benchmark floor"}]},{"n":2,"id":"day2","label":"Day 2","title":"Statistical forecasters","sessions":[{"n":1,"label":"Session 1","title":"Exponential smoothing"},{"n":2,"label":"Session 2","title":"ARIMA-family models"},{"n":3,"label":"Session 3","title":"Weather and moving holidays"},{"n":4,"label":"Session 4","title":"Intervals that hold"}]},{"n":3,"id":"day3","label":"Day 3","title":"Many series and pretrained models","sessions":[{"n":1,"label":"Session 1","title":"Many series and hierarchies"},{"n":2,"label":"Session 2","title":"Global boosted forecasters"},{"n":3,"label":"Session 3","title":"Pretrained zero-shot forecasters"},{"n":4,"label":"Session 4","title":"Choosing among families"}]},{"n":4,"id":"day4","label":"Day 4","title":"Review and communicate","sessions":[{"n":1,"label":"Session 1","title":"Leakage across time"},{"n":2,"label":"Session 2","title":"New and short series"},{"n":3,"label":"Session 3","title":"Combining forecasts"},{"n":4,"label":"Session 4","title":"Fan charts and forecast notes"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone project presentations","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-frame-first-q1","type":"single","prompt":"A planner writes: \"Send me next month's demand for Al-Sahil by Thursday.\" Being short costs her four times what being long costs. What does the desk reply with first?","options":[{"key":"A","text":"The most accurate model's mean forecast for each day"},{"key":"B","text":"One number for the month, the average of the last three years"},{"key":"C","text":"The frame: daily or monthly, which decision, and the 80th percentile"},{"key":"D","text":"The figure in the annual budget, so the two stay consistent"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision fixes the time step and the level, and a cost ratio of 4 to 1 asks for the quantile 4 / 5, not the mean.","misconceptions":["Starts modelling before the frame exists: the best model of the wrong target is still wrong","Treats a monthly total as the request without asking: the decision may be daily","","Confuses a target with a forecast: the budget is what someone wants, not what is expected"],"lo":["LO5"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-frame-first","title":"What do you send back first?"},"level":null,"pool":"checkpoint"},{"id":"check-wrong-eid-days-q1","type":"single","prompt":"A model with a 365-day season forecasts Al-Rimal for spring 2026. It is far too high on a few days in March and too low on a few in early April. What is the likely cause?","options":[{"key":"A","text":"Eid al-Fitr moved about 11 days earlier than in 2025"},{"key":"B","text":"Spring weather is more variable than summer weather"},{"key":"C","text":"The weekend is Friday and Saturday, not Saturday and Sunday"},{"key":"D","text":"Demand grew faster in 2026 than the model assumed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The model repeats the 2025 dip on the 2025 dates. In 2026 the dip comes earlier: the model is too high where Eid now is, and too low where it was.","misconceptions":["","Blames noise for an error with a pattern: too high on some days and too low on others, a fixed distance apart, is a shift","Mixes up the weekly and the annual pattern: a weekday error would repeat every week, not on a few days","Reads a holiday as growth: a trend error would grow with the horizon, not sit on a few days"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-wrong-eid-days","title":"Why does last year's pattern miss Eid?"},"level":null,"pool":"checkpoint"},{"id":"check-remainder-reading-q1","type":"single","prompt":"You decompose a region's log demand with weekly and annual periods. The remainder is near zero on average, but about -0.12 on the same ten days every year: the days around the two Eids. What do you conclude?","options":[{"key":"A","text":"The annual season needs a longer smoothing window"},{"key":"B","text":"The fit should be made robust so these days are ignored"},{"key":"C","text":"The series should be decomposed without the logarithm"},{"key":"D","text":"The effect is real and regular, and needs a regressor of its own"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A fixed 365-day season cannot hold an event that moves 11 days a year, so the effect stays in the remainder. A calendar regressor can carry it.","misconceptions":["Asks the season to hold what moves: a longer smoothing window still assumes the same dates each year","Treats a regular effect as an outlier: robust fitting keeps it out of the season, it does not explain it","Reads a level effect as a variance problem: the log already handles swings that grow with the level",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-remainder-reading","title":"What does this remainder tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-which-floor-q1","type":"single","prompt":"A colleague reports a floor for a 28-day daily forecast: seasonal naive with m = 7, tested on the 28 days after one origin in January, error 0.28 after scaling. What is the main weakness?","options":[{"key":"A","text":"The scale should come from the test days, not the training days"},{"key":"B","text":"One origin in a calm month says little about the other eleven"},{"key":"C","text":"A seasonal naive forecast is too simple to count as a floor"},{"key":"D","text":"The horizon should be shortened to 7 days to match m = 7"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A single fold is an anecdote. In the lab the same method scores 0.28 in the first fold and 1.62 over 13 folds that cover the year.","misconceptions":["Thinks the scale must be recomputed on test data: the denominator belongs to the training window by design","","Assumes a floor must be a fitted model: a floor is the best method that needs no fitting","Confuses the horizon with the season: the horizon is fixed by the decision and stays at 28"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-which-floor","title":"Which backtest is a fair floor?"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"A method scores 1.3 on a region in the course's backtest. The floor scores 1.06. A colleague says: \"Above 1, so it is worse than a naive forecast and useless.\" What is the right reading?","options":[{"key":"A","text":"Right: any score above 1 loses to the naive forecast"},{"key":"B","text":"It loses to the floor, because 1.3 is above 1.06"},{"key":"C","text":"It is wrong by 130% of demand on an average day"},{"key":"D","text":"Nothing can be said: the measure does not work at 28 days"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The yardstick is the in-sample error of \"last week\", one week ahead. At 28 days even the floor is above 1. A method is judged by its distance to the floor.","misconceptions":["Reads 1 as the floor: 1 is the one-week-ahead in-sample error, and the floor itself is above it at 28 days","","Treats the scaled error as a percentage: it is a ratio of two errors, not a share of demand","Dismisses the measure because the yardstick is short: the comparison with the floor is still valid"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"What does the scaled error compare?"},"level":null,"pool":"checkpoint"},{"id":"check-ets-season-q1","type":"single","prompt":"An ETS model with a weekly season forecasts a hot region's daily demand 28 days ahead. Its fitted alpha is 0.99 and it scores 1.6 against a floor of 1.1. Which change is most likely to bring it under the floor?","options":[{"key":"A","text":"Set alpha to 0.3 by hand for a smoother level"},{"key":"B","text":"Add a damped trend to the weekly model"},{"key":"C","text":"Train on nine years, not three"},{"key":"D","text":"Remove the annual season by decomposition before smoothing"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The model's error at 28 days is the summer it cannot see. A decomposition with a 365-day period hands it a series without that pattern and adds the pattern back.","misconceptions":["Tunes the weight the fit already chose: a lower alpha was tried by the optimiser and lost","Adds a slope where the miss is a season: a trend extrapolates the last weeks in a straight line","Trains on more of the same blindness: more history does not give the model an annual season",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-ets-season","title":"Which change helps this model most?"},"level":null,"pool":"checkpoint"},{"id":"check-residual-test-q1","type":"single","prompt":"A seasonal ARIMA is fitted to three years of daily demand. The Ljung-Box p-value of its residuals is 0.0003 and its backtest score is close to the floor. What do you do next?","options":[{"key":"A","text":"Look for the pattern left in the residuals and give the model a term for it"},{"key":"B","text":"Report the model: a p-value this small shows the fit is significant"},{"key":"C","text":"Rerun the test with more lags until it passes"},{"key":"D","text":"Drop ARIMA and move to another model family"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A small p-value says the one-step errors still hold structure. Find it and add it: in the lab it was the annual season.","misconceptions":["","Reads a small p-value as a pass: here a small value means the residuals are not noise","Fixes the test and not the model: more lags change the statistic, not what the model misses","Throws away a diagnosis: a failed test says where to improve the model, not that the family is wrong"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-residual-test","title":"What does this diagnostic tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-future-regressor-q1","type":"single","prompt":"You forecast a region's demand 28 days ahead with a regression with ARIMA errors. In the backtest, which of these regressors may be filled with its true values for the 28 test days?","options":[{"key":"A","text":"The measured daily temperature"},{"key":"B","text":"The demand of the neighbouring region"},{"key":"C","text":"The first day of Eid al-Adha in the official calendar"},{"key":"D","text":"The spot price of energy on each day"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A calendar date is known at the origin. Every measured quantity must be replaced by what was known or forecast at the origin.","misconceptions":["Uses a measurement from the future: the temperature of a test day is not known at the origin","Uses another unknown series: the neighbour's demand on a test day is as unknown as this region's","","Uses a quantity fixed only after the day: the spot price is set by the demand being forecast"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-future-regressor","title":"Which regressor may use its true future values?"},"level":null,"pool":"checkpoint"},{"id":"check-coverage-reading-q1","type":"single","prompt":"Model P: scaled error 0.75, its 80% interval covers 62% of days. Model Q: scaled error 0.80, its 80% interval covers 79%. The planner buys on the 0.8 quantile. What do you deliver?","options":[{"key":"A","text":"Model P as it is: it has the lower error"},{"key":"B","text":"Model Q, or model P with intervals rebuilt from its backtest errors"},{"key":"C","text":"Model P with every interval doubled in width"},{"key":"D","text":"Neither: average the two scaled errors and report 0.775"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A quantile that is not calibrated costs the planner on every purchase. Use intervals that hold, or repair the better point forecast from its own backtest errors.","misconceptions":["Ranks by the point score alone: the planner acts on a quantile, and this model's quantiles are too close to the middle","","Widens by guesswork: an arbitrary factor has no measured coverage behind it","Averages two numbers that measure different things: coverage is not improved by mixing in a point score"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-coverage-reading","title":"Which forecast would you hand to the planner?"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"A regression forecasts daily demand 28 days ahead. Its backtest scores 0.55 with four regressors. Which one makes that score dishonest?","options":[{"key":"A","text":"A column that is 1 on the days of Eid al-Fitr"},{"key":"B","text":"The day of the week of the target day"},{"key":"C","text":"The temperature measured on the target day"},{"key":"D","text":"Mean demand of the 28 days before the origin"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A regressor may use its future values only when they are known at the origin. The measured temperature is not: in Lab 2.3 it flattered the score from 0.77 to 0.55.","misconceptions":["Depends on the date only: the announced Hijri calendar is known at the origin","Depends on the date only: every future weekday is known","","Uses days up to the origin only: a lag of 28 or more is known for every horizon day"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Which regressor may use its future values?"},"level":null,"pool":"checkpoint"},{"id":"check-reconciliation-q1","type":"single","prompt":"In one region the regional model scores 0.89 on the held-out weeks and the sum of the feeder forecasts scores 0.58 against the regional total. Purchasing and operations need one coherent set. Which is the defensible choice?","options":[{"key":"A","text":"Bottom-up: here the feeder models carry the better information"},{"key":"B","text":"Top-down, because it won in Al-Dana"},{"key":"C","text":"Keep both base forecasts and let each department use its own"},{"key":"D","text":"Least squares, because it uses both levels"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Reconciliation moves forecasts towards the level it trusts. Trust the level that measured better on held-out data.","misconceptions":["","Applies the result of another region as a rule: top-down spreads the error of the weaker regional model over every feeder","Leaves two departments planning on different totals: coherence is the requirement","Assumes the more complex method must win: least squares moves the feeders towards a regional forecast that is worse"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-reconciliation","title":"Which reconciliation, and on what evidence?"},"level":null,"pool":"checkpoint"},{"id":"check-global-split-q1","type":"single","prompt":"A global model forecasts 28 days ahead from a table with one row per series, origin and horizon day. The analyst trains on all rows whose origin is before 1 June and tests at the origin of 1 June. The score is far better than any other's. What should be checked first?","options":[{"key":"A","text":"Whether the training table has enough rows per series"},{"key":"B","text":"Whether the number of trees was tuned"},{"key":"C","text":"Whether the target was scaled per series"},{"key":"D","text":"Whether training rows have target days after 1 June"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A row with an origin of 25 May and a horizon of 28 days has a target on 22 June. Split by the date of the target.","misconceptions":["Looks at the amount of data: more rows do not explain a score that is too good","Looks at tuning: the number of trees changes the score a little, not a lot","Looks at a transformation: scaling changes accuracy but hands the model no future values",""],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-global-split","title":"What is wrong with this training table?"},"level":null,"pool":"checkpoint"},{"id":"check-pretrained-baseline-q1","type":"single","prompt":"A pretrained forecaster, zero-shot, has a skill of 0.10 on a fold of ordinary weeks and of -0.30 on a fold with a moving holiday. It was given 512 days of history and nothing else. Which conclusion is supported?","options":[{"key":"A","text":"Pretrained forecasters do not work on energy demand"},{"key":"B","text":"It lacks the calendar: a baseline for ordinary weeks, not for holidays"},{"key":"C","text":"Its skill is -0.10 on average, so it is slightly worse than the floor"},{"key":"D","text":"It needs a longer context to learn the holiday"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Read a score against what the method was given. A model that sees only past values cannot place a holiday that moves 11 days a year.","misconceptions":["Generalises from one family and one size: the result is about this model with this input","","Averages away the finding: the mean hides that the loss sits in one kind of week","Blames the amount of history: a moving holiday is at a different date in any context of past days"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-pretrained-baseline","title":"What does this result allow you to say?"},"level":null,"pool":"checkpoint"},{"id":"check-scorecard-choice-q1","type":"single","prompt":"Skill against the floor on 200 series: X 0.21, Y 0.20, Z 0.05. X is a pretrained model under a non-commercial licence. Y is a boosted model under a permissive licence. Z is the fastest. The forecasts will run a utility's weekly purchasing. Which family?","options":[{"key":"A","text":"X: it has the highest skill"},{"key":"B","text":"Z: it is the fastest of the three"},{"key":"C","text":"Y: within 0.01 of the best, and its licence permits the use"},{"key":"D","text":"X now, and ask about the licence after the pilot"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A licence is a gate, not a weight: a method that may not be used has no score. Among the methods that pass, 0.01 of skill is inside any noise.","misconceptions":["Ranks on accuracy alone: the licence rules X out for a company's operations whatever it scores","Ranks on run time alone: Z gives up three quarters of the skill for seconds that purchasing does not need","","Treats the licence as a detail to settle later: use in operations comes first, permission cannot follow"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-scorecard-choice","title":"Which choice can be defended?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"On two held-out folds, method P scores 0.64 (0.75 and 0.53 by fold) and method Q scores 0.62 (0.73 and 0.51). P is a table lookup; Q needs a feature pipeline. What is the sound reading?","options":[{"key":"A","text":"Q is the more accurate method and should replace P"},{"key":"B","text":"The gap is small beside the spread between folds: prefer the simpler P"},{"key":"C","text":"Two folds are too few to say anything about either method"},{"key":"D","text":"Q, because a trained model will improve as data arrives"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A difference counts when it is large beside the fold-to-fold spread. When it is not, the simplest method within noise of the best is the defensible choice.","misconceptions":["Reads two hundredths as a result: the folds of one method differ by ten times as much","","Dismisses two folds that agree: both methods can still be compared with the floor and with each other","Assumes complexity earns trust: upkeep is a cost, and nothing here pays for it"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"What may be said about these two methods?"},"level":null,"pool":"checkpoint"},{"id":"check-selection-leak-q1","type":"single","prompt":"An analyst backtests four models on the 13 folds of 2025. Every feature and regressor passes a known-at-the-origin test. She reports: \"Our forecast scores 0.70: for each fold we use the model that was most accurate on it.\" What should the review memo say?","options":[{"key":"A","text":"Nothing: the features are clean, so the score stands"},{"key":"B","text":"Add more models, so that the best one per fold is better still"},{"key":"C","text":"The model was chosen on the test folds: choose on earlier folds and rescore"},{"key":"D","text":"Report the pinball loss in place of the scaled error"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Picking the winner of each fold uses the fold's outcome. An honest score comes from a choice made before the test data were seen.","misconceptions":["Accepts the claim because the columns are clean: the leak is in the choice, not in a column","Asks for more of the same: more models chosen per fold would flatter the score further","","Changes the measure, not the procedure: any score is flattered by choosing after the fact"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-selection-leak","title":"Where is the leak?"},"level":null,"pool":"checkpoint"},{"id":"check-cold-start-q1","type":"single","prompt":"A charging hub opened six weeks ago, in spring. Forty older hubs in the same city have two years of history and a clear summer rise. The planner needs the next four weeks. Which approach is the soundest starting point?","options":[{"key":"A","text":"The older hubs' seasonal shape at this time of year, times the new hub's level"},{"key":"B","text":"A seasonal ARIMA with an annual season on the hub's six weeks"},{"key":"C","text":"The average demand of the forty older hubs"},{"key":"D","text":"No forecast until the hub has a full year of data"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A short series knows its own level and little else. The season is borrowed from series that have lived through it.","misconceptions":["","Fits an annual pattern to six weeks: a 365-day season cannot be estimated from 42 days","Uses the wrong level: the older hubs' mean says nothing about how busy this hub is","Refuses the task: the planner must decide now, and a forecast with stated limits serves better than none"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-cold-start","title":"Which forecast for a site that opened six weeks ago?"},"level":null,"pool":"checkpoint"},{"id":"check-best-in-hindsight-q1","type":"single","prompt":"A report says: \"On the 2025 test folds the average of our four models scored 0.80. The best single model scored 0.76. We therefore deliver the best single model.\" What is the weakness of the argument?","options":[{"key":"A","text":"The average should have used weights fitted on the 2025 folds"},{"key":"B","text":"Four models are too few for an average to work"},{"key":"C","text":"The scaled error cannot compare an average with a single model"},{"key":"D","text":"\"Best\" was read off the test folds: the choice was not available in advance"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The average is one forecast fixed beforehand. \"The best single model\" is four candidates and a choice made after seeing the results.","misconceptions":["Asks for tuning on the same folds: weights fitted to the test year would repeat the fault","Changes the subject: the number of models is not what makes the comparison unfair","Attacks the measure: the same fault would remain with any score",""],"lo":["LO4"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-best-in-hindsight","title":"Is this comparison fair to the average?"},"level":null,"pool":"checkpoint"},{"id":"check-forecast-note-q1","type":"single","prompt":"A forecast's 80% band covered 71% of days in last year's backtest. The planner buys energy at the upper edge of that band. Which sentence should the note carry?","options":[{"key":"A","text":"\"Demand will be inside the band with a probability of 80%.\""},{"key":"B","text":"\"Last year the band held on 71 days in 100; it is narrower than its name.\""},{"key":"C","text":"\"The interval is approximately calibrated.\""},{"key":"D","text":"\"The band shows the uncertainty of the forecast.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The note reports what was measured, in counts. A buyer at the upper edge must know that demand went outside the band more often than the label says.","misconceptions":["States the intention as a result: the band was built for 80% and did not deliver it","","Hides the measurement behind a term the planner cannot act on","Leaves out the one fact the buyer needs: how often the edge was exceeded"],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-forecast-note","title":"Which sentence belongs in the note?"},"level":null,"pool":"checkpoint"},{"id":"q-floor-choice-01","type":"single","prompt":"A water utility backtests three naive forecasts of daily consumption over 12 rolling origins with a 14-day horizon. Scaled errors: last day 1.40, same weekday last week 0.95, same weekday 52 weeks ago 1.20. Which one is the benchmark floor for this series?","options":[{"key":"A","text":"The last day, because it uses the newest value"},{"key":"B","text":"The same weekday last week, at 0.95"},{"key":"C","text":"The same weekday 52 weeks ago, as for electricity"},{"key":"D","text":"The mean of the three, at about 1.18"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The floor is the best naive method in the backtest of this series at this horizon: here the weekly seasonal naive, at 0.95. Which naive method wins differs from series to series.","misconceptions":["Takes the freshest data for the best forecast: the backtest says it is the worst of the three","","Carries the result of another series over: the floor is whichever naive method wins on this series and horizon","Averages scores as if that made a method: the floor is one naive method, the best one"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"the-floor-table","title":"The floor is \"the same weekday last year\", at 1.06"},"level":"apply","pool":"practice"},{"id":"q-rolling-origins-01","type":"single","prompt":"You must test a 28-day forecast on the last 168 days of a series, so that every one of those days is tested exactly once. How many rolling origins do you need, and how far apart?","options":[{"key":"A","text":"168 origins, one day apart"},{"key":"B","text":"1 origin, 168 days before the end"},{"key":"C","text":"24 origins, 7 days apart"},{"key":"D","text":"6 origins, 28 days apart"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"168 / 28 = 6 folds. With origins 28 days apart, the 28-day test windows touch without overlapping, so each day is tested once.","misconceptions":["Moves the origin every day: each day would then be tested up to 28 times, not once","Uses one long fold: the horizon would be 168 days, not 28","Spaces the origins by the season, not by the horizon: the 28-day test windows would overlap",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"rolling-origins","title":"Move the origin through the last year and forecast 28 days each time"},"level":"apply","pool":"practice"},{"id":"q-scaled-error-01","type":"single","prompt":"On the test days a forecast for one feeder has a mean absolute error of 9 MWh. Inside the training data, the weekly seasonal naive forecast had a mean absolute error of 6 MWh. What is the scaled error, and what does it say?","options":[{"key":"A","text":"1.5: the forecast errs 1.5 times as much as last week's value did in training"},{"key":"B","text":"0.67: the forecast is a third better than the seasonal naive forecast"},{"key":"C","text":"3 MWh: the forecast is 3 MWh worse than the seasonal naive forecast"},{"key":"D","text":"1.5: the forecast is wrong by 150% of demand on an average day"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"9 / 6 = 1.5. The scaled error divides the test error by the in-sample error of the weekly seasonal naive forecast, so it has no unit and can be compared across series.","misconceptions":["","Inverts the ratio: the test error goes on top, the training yardstick below","Subtracts where the measure divides: a scaled error has no unit","Reads a scaled error as a percentage of demand: it is a ratio of two errors"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"scaled-error","title":"A scaled error lets a region and a feeder share one table"},"level":"apply","pool":"practice"},{"id":"q-strength-01","type":"single","prompt":"After decomposing a region's log demand, the remainder has variance 0.002 and the annual season plus the remainder has variance 0.010. What is the strength of the annual season?","options":[{"key":"A","text":"0.20"},{"key":"B","text":"0.50"},{"key":"C","text":"0.80"},{"key":"D","text":"5.00"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Strength = 1 - 0.002 / 0.010 = 0.80: the annual season dominates the remainder.","misconceptions":["Reports the ratio itself: strength is one minus the ratio","Guesses the middle without computing the ratio of the two variances","","Divides the wrong way round: strength lies between 0 and 1"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"strength-of-a-component","title":"Strength compares a component with the noise around it"},"level":"apply","pool":"practice"},{"id":"q-log-decomposition-01","type":"single","prompt":"A district-cooling plant's daily load has doubled in five years. Its summer peak was 300 MWh above the winter level five years ago and is 600 MWh above it now. How should you decompose the series?","options":[{"key":"A","text":"Decompose the load itself, with a longer trend window"},{"key":"B","text":"Decompose the last year only, where the swing is constant"},{"key":"C","text":"Decompose the load without an annual season"},{"key":"D","text":"Decompose the logarithm of the load"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The seasonal swing grows with the level, so the parts multiply. On the log scale the swing is a constant addition, which is what an additive decomposition assumes.","misconceptions":["Changes the smoothing when the problem is the scale: the swing would still grow with the level","Throws away the history to hide the problem: one year cannot separate a trend from a season","Drops the component that is changing: the summer is the main pattern",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"series-as-parts","title":"Split the series into parts you can name, and one you cannot"},"level":"understand","pool":"practice"},{"id":"q-time-scales-01","type":"single","prompt":"You plot six years of daily demand for a commercial district as one line. You see growth and a summer peak, and nothing else. A colleague says the district has no weekly pattern. What do you do before agreeing?","options":[{"key":"A","text":"Plot four weeks of daily values and compute the mean of each weekday"},{"key":"B","text":"Plot monthly totals, where patterns are easier to see"},{"key":"C","text":"Agree, since six years of data would show a weekly pattern"},{"key":"D","text":"Fit a model with a weekly season and see whether it runs"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each time scale hides the others. A weekly cycle only shows when you zoom to a few weeks, and a weekday profile measures it.","misconceptions":["","Aggregates further: a monthly total removes the week completely","Trusts one time scale: at six years a seven-day cycle is thinner than the line","Lets a model answer what a plot answers: a model fits a season whether or not one is there"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"friday-is-the-low-day","title":"The week only shows when you zoom in, and it starts on Sunday"},"level":"understand","pool":"practice"},{"id":"q-cost-quantile-01","type":"single","prompt":"A hospital orders oxygen one week ahead. Each unit short costs 3 times what each unit left over costs. The forecast desk can deliver any quantile of next week's use. Which one should the hospital order?","options":[{"key":"A","text":"The 25th percentile"},{"key":"B","text":"The 50th percentile"},{"key":"C","text":"The 75th percentile"},{"key":"D","text":"The 99th percentile"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The quantile that minimises expected cost is cost of under / (cost of under + cost of over) = 3 / (3 + 1) = 0.75.","misconceptions":["Inverts the costs: puts the cost of a surplus on top","Hands over the middle whatever the costs: right only when the two costs are equal","","Treats any shortfall as unacceptable: the stated costs say 3 to 1, not infinite"],"lo":["LO5"],"day":1,"session":1,"slide":{"deck":"day1","id":"cost-to-quantile","title":"Unequal costs move the answer away from the middle"},"level":"apply","pool":"practice"},{"id":"q-data-delay-01","type":"single","prompt":"A planner needs a forecast for each of the next 14 days. The meter data reaches the forecast desk 3 days late. How many steps ahead of its last observation must the model forecast to cover the last day the planner needs?","options":[{"key":"A","text":"11 steps"},{"key":"B","text":"14 steps"},{"key":"C","text":"17 steps"},{"key":"D","text":"42 steps"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The origin is the last day the model has seen, 3 days before the forecast is sent, so the furthest day is 14 + 3 = 17 steps ahead.","misconceptions":["Subtracts the delay: late data makes the forecast longer, not shorter","Counts from the day the forecast is sent, not from the last day of data","","Multiplies horizon and delay: the delay is added once"],"lo":["LO5"],"day":1,"session":1,"slide":{"deck":"day1","id":"data-delay-steps","title":"A 28-day forecast from two-day-old data is a 30-step forecast"},"level":"apply","pool":"practice"},{"id":"q-ses-level-01","type":"single","prompt":"Simple exponential smoothing with alpha = 0.2 has a level of 100. The next observed value is 150. What is the new level, and what is the forecast for five days ahead?","options":[{"key":"A","text":"Level 110, forecast 110"},{"key":"B","text":"Level 140, forecast 140"},{"key":"C","text":"Level 110, forecast 160"},{"key":"D","text":"Level 125, forecast 125"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"New level = 0.2 × 150 + 0.8 × 100 = 110. Simple exponential smoothing forecasts that level for every future day.","misconceptions":["","Swaps the weights: gives 0.8 to the new value and 0.2 to the old level","Adds a slope the method does not have: the forecast of simple smoothing is flat","Averages the two values equally, whatever alpha is"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"averages-that-forget","title":"A weighted average that forgets the past at a rate you choose"},"level":"apply","pool":"practice"},{"id":"q-ets-annual-01","type":"single","prompt":"A cooling plant's daily load is forecast 28 days ahead in April. An ETS model with a 7-day season is always too low in weeks 3 and 4, by a growing amount. The weekday pattern is forecast well. What is the most likely cause?","options":[{"key":"A","text":"The smoothing weight alpha is too high"},{"key":"B","text":"The weekly season should be multiplicative"},{"key":"C","text":"The model has no annual season, so its level stays flat while load climbs"},{"key":"D","text":"The backtest has too few origins to judge"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A flat level with a weekday pattern cannot follow the climb into summer. The error grows with the horizon because the missing annual season moves further from the last level each week.","misconceptions":["Blames the weight for a missing component: no alpha makes a flat level follow the spring","Changes the form of a season that is forecast well: the miss is at a longer time scale","","Blames the instrument: a miss that grows with the horizon in the same direction is a pattern, not noise"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"decompose-then-smooth","title":"Decompose, smooth what is left, put the seasons back"},"level":"analyze","pool":"practice"},{"id":"q-ljung-box-01","type":"single","prompt":"Two ARIMA models are fitted to the same series. Ljung-Box p-values of their residuals: model 1 gives 0.48, model 2 gives 0.002. Their backtest scores are equal. Which statement is right?","options":[{"key":"A","text":"Model 2 is better: its result is statistically significant"},{"key":"B","text":"Model 1 has residuals that look like noise; model 2 leaves a pattern unused"},{"key":"C","text":"The models are equal, because the backtest scores are equal"},{"key":"D","text":"Model 1 is overfitted, because its p-value is too high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The test asks whether the residual autocorrelations are larger than noise would give. A large p-value means no evidence of leftover structure; a small one means the model has not used everything, and its intervals are suspect.","misconceptions":["Reads a small p-value as good news: here it means the residuals are not noise","","Ignores the diagnostic: equal point scores do not make the intervals equally trustworthy","Invents a rule: a high p-value here only says no leftover correlation was found"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"residuals-must-be-noise","title":"If the residuals still hold a pattern, the model has not finished"},"level":"apply","pool":"practice"},{"id":"q-fourier-future-01","type":"single","prompt":"A colleague asks why annual sine and cosine columns may be given to a model for the 28 future days, when the measured temperature may not. What do you answer?","options":[{"key":"A","text":"The sine and cosine columns are smoother than the temperature"},{"key":"B","text":"The model needs at least four regressors to be stable"},{"key":"C","text":"The temperature has too many missing values"},{"key":"D","text":"They depend on the date only, and every future date is known at the origin"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A regressor may use its true future values only if those values are known when the forecast is made. A function of the date is; a measurement is not.","misconceptions":["Looks at the shape of the regressor: smoothness is not what makes a regressor allowed","Invents a requirement: the number of regressors is not the issue","Answers a data-quality question that was not asked",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"annual-fourier-terms","title":"Two pairs of annual waves give ARIMA the summer"},"level":"understand","pool":"practice"},{"id":"q-oracle-temperature-01","type":"single","prompt":"A regression with ARIMA errors is backtested twice on the same folds. With the future temperature as known at the origin it scores 0.80. With the temperature measured on each test day it scores 0.58. Which number goes in the report to the planner, and why?","options":[{"key":"A","text":"0.58, because it shows what the model can do"},{"key":"B","text":"0.69, the mean of the two, as a fair compromise"},{"key":"C","text":"0.80, because only that forecast could have been made at the origin"},{"key":"D","text":"0.58, with a footnote that weather was assumed known"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The score must describe the forecast the planner will get. The measured temperature of a future day is not available at the origin, so 0.58 is a leak. The gap of 0.22 is useful separately: it is what a perfect weather forecast would be worth.","misconceptions":["Reports the model's potential as its performance: the planner will never receive that forecast","Averages an honest score with a leaked one: the result describes no forecast that exists","","Keeps the flattering number and hides the leak in a note: the headline still misleads"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"honest-against-oracle","title":"With the temperature measured later, the score flatters by 0.22"},"level":"analyze","pool":"practice"},{"id":"q-eid-regressor-01","type":"single","prompt":"A dynamic regression is given an Eid regressor. Over a year of backtest folds its scaled error falls from 0.90 to 0.88 overall. On the 11 Eid days it falls from 1.40 to 0.85. A reviewer says the regressor \"adds 2%\" and is not worth keeping. What is the better reading?","options":[{"key":"A","text":"The reviewer is right: 0.02 is within noise"},{"key":"B","text":"The regressor removes about 40% of the error on the days it was built for"},{"key":"C","text":"The regressor should be dropped and the Eid days deleted from the test"},{"key":"D","text":"The gain proves the model is now right on every holiday"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An average over the year hides a gain concentrated on a few days. Scored on the Eid days alone, the error falls from 1.40 to 0.85, about 40%.","misconceptions":["Judges by the yearly average only: 11 days out of 364 cannot move it much","","Removes the hard days from the test: those are the days the planner remembers","Generalises from Eid to all holidays: the test says nothing about days without a regressor"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"gain-on-eid-days","title":"The calendar moves the Eid days from 1.34 to 0.80"},"level":"apply","pool":"practice"},{"id":"q-coverage-01","type":"single","prompt":"In a backtest of 280 test days, the actual value fell inside a model's 80% interval on 182 days. What is the coverage, and what does it say about the interval?","options":[{"key":"A","text":"65%: the interval is too narrow"},{"key":"B","text":"65%: the interval is too wide"},{"key":"C","text":"80%: the interval is correct by construction"},{"key":"D","text":"35%: the share of days outside the interval"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"182 / 280 = 65%. An 80% interval should hold about 80% of the time; holding 65% means it is too narrow and the planner is surprised more often than promised.","misconceptions":["","Reads low coverage as a wide interval: values escape a band that is too thin","Takes the label for the measurement: the stated level is a promise, not a result","Reports the complement and stops: 35% outside against a promised 20% is the finding"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"coverage-of-three-models","title":"The most accurate model keeps its promise least"},"level":"apply","pool":"practice"},{"id":"q-pinball-01","type":"single","prompt":"A forecast of the 0.8 quantile of tomorrow's demand is 500 MWh. Demand turns out to be 520 MWh. What is the pinball loss of this one forecast?","options":[{"key":"A","text":"4"},{"key":"B","text":"10"},{"key":"C","text":"16"},{"key":"D","text":"20"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Demand is above the forecast, so the loss is tau × (y - q) = 0.8 × 20 = 16. Had demand been 480, the loss would be 0.2 × 20 = 4.","misconceptions":["Uses the weight for a forecast that was too high: 0.2 × 20","Halves the miss as for the median, whatever the quantile","","Reports the absolute error: the pinball loss weights it by the quantile level"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"pinball-loss","title":"Pinball loss charges a quantile unequally for its two kinds of miss"},"level":"apply","pool":"practice"},{"id":"q-rebuild-intervals-01","type":"single","prompt":"You rebuild a model's intervals from the errors of its backtest. For the fold with origin 1 July you use the errors of all 26 folds, including July to December of the same year. Coverage of the 80% interval comes out at exactly 80%. What is wrong?","options":[{"key":"A","text":"Nothing: 80% is the target"},{"key":"B","text":"The errors should not be scaled before taking quantiles"},{"key":"C","text":"Too many folds were used: four are enough"},{"key":"D","text":"The interval uses errors made after its origin, so its coverage is flattered"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval for a forecast made on 1 July may only use what was known then. Errors of later folds, its own included, are in its future: using them leaks, and the coverage measured afterwards is not one the planner will see.","misconceptions":["Accepts a perfect result without asking how it was produced","Questions a harmless step: scaling lets folds with different levels share one set of errors","Thinks less data is safer: fewer folds would miss the seasonal change in error size",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"intervals-from-backtest-errors","title":"Rebuild the interval from the errors the backtest already made"},"level":"analyze","pool":"practice"},{"id":"q-bottom-up-total-01","type":"single","prompt":"A district has three substations. Their forecasts for tomorrow are 40, 25 and 15 MWh. A separate model for the district forecasts 90 MWh. Under bottom-up reconciliation, what are the reconciled forecasts?","options":[{"key":"A","text":"Substations 40, 25 and 15; district 80"},{"key":"B","text":"Substations 45, 28.1 and 16.9; district 90"},{"key":"C","text":"Substations 40, 25 and 15; district 90"},{"key":"D","text":"Substations 42.5, 27.5 and 17.5; district 87.5"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Bottom-up keeps the lowest level and sums it: 40 + 25 + 15 = 80. The district model is not used.","misconceptions":["","Applies top-down: scales the substations to the district forecast, which bottom-up discards","Leaves the base forecasts as they are: they do not add up, so nothing was reconciled","Applies least squares: spreads the gap over all four forecasts"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"bottom-up-top-down","title":"Two simple ways to make them add up"},"level":"apply","pool":"practice"},{"id":"q-least-squares-gap-01","type":"single","prompt":"A region has 4 feeders. The feeder forecasts for one day add up to 190 MWh and the regional model forecasts 200 MWh. Ordinary least squares reconciliation gives every feeder an equal part of the gap, gap / (n + 1). What is the reconciled regional total?","options":[{"key":"A","text":"200 MWh"},{"key":"B","text":"190 MWh"},{"key":"C","text":"198 MWh"},{"key":"D","text":"195 MWh"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The gap is 10. Each feeder moves by 10 / 5 = 2 MWh, so the total moves by 8 to 198. The more feeders, the closer the total comes to the regional forecast.","misconceptions":["Assumes the total moves all the way to the regional forecast: that is top-down","Assumes the feeders do not move: that is bottom-up","","Splits the gap in half between the levels, whatever the number of feeders"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"least-squares-reconciliation","title":"Least squares: move every forecast as little as possible"},"level":"apply","pool":"practice"},{"id":"q-reconcile-which-level-01","type":"single","prompt":"In a backtest of one hierarchy, top-down reconciliation raised the error of the lowest level from 0.65 to 0.88. The upper-level model scored 0.89 against the total, and the sum of the lower-level forecasts scored 0.58 against the same total. What explains the result?","options":[{"key":"A","text":"Top-down always loses information about the lower level"},{"key":"B","text":"The upper-level model was the weaker one, and top-down spread its error downwards"},{"key":"C","text":"The lower-level forecasts were not coherent before reconciliation"},{"key":"D","text":"The scaled error cannot be compared across levels"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Top-down trusts the upper level. Here the sum of the lower-level forecasts was the better forecast of the total (0.58 against 0.89), so forcing the lower level to follow the upper-level model made it worse.","misconceptions":["States a rule the data do not support: in other hierarchies top-down lowers the error","","Describes every set of base forecasts: that is why reconciliation is needed, not why it hurt","Blames the measure: both figures quoted for the total are on the same scale"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"reconciliation-twelve-regions","title":"Top-down helps where the regional model is the better one"},"level":"analyze","pool":"practice"},{"id":"q-global-scaling-01","type":"single","prompt":"One boosted model is trained across 300 series whose daily means range from 20 to 4,000 units. Trained on the raw values, its scaled error is six times worse than when each series is divided by its own recent mean first. Why does the division help so much?","options":[{"key":"A","text":"Boosted trees cannot handle values above 1,000"},{"key":"B","text":"Dividing removes the weekly season from each series"},{"key":"C","text":"The division shortens the training time"},{"key":"D","text":"Without it the trees spend their splits on the size of a series, not on its pattern"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With raw targets the largest differences between rows are differences of size between series. After dividing by each series’ own level, all series look alike and the trees can learn patterns shared across them.","misconceptions":["Invents a limit: trees split on any numeric range","Confuses scaling with seasonal adjustment: a constant divisor leaves the pattern in place","Names a side effect at most: it does not explain the change in accuracy",""],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"scale-the-target","title":"Divide each feeder by its own recent level, and the series look alike"},"level":"understand","pool":"practice"},{"id":"q-quantile-objective-01","type":"single","prompt":"Three boosted models are trained with the quantile objective for 0.1, 0.5 and 0.9. On held-out days, actual demand falls between the 0.1 and 0.9 forecasts on 71% of days. Which statement is right?","options":[{"key":"A","text":"The interval is too narrow: it claims 8 days in 10 and holds on about 7"},{"key":"B","text":"The interval is well calibrated, because 71% is close to 0.9 minus 0.1"},{"key":"C","text":"The median model is biased"},{"key":"D","text":"The quantile models crossed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The 0.1 to 0.9 interval should contain 80% of outcomes. Holding on 71% means the edges are too close together, and a buyer at the 0.9 edge is exceeded more often than 1 day in 10.","misconceptions":["","Accepts a gap of nine points as close: over a year that is a month of extra misses","Reads coverage as a statement about the centre: the 0.5 forecast is not measured by it","Names another fault: crossing is quantiles out of order, and is measured separately"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"boosted-quantiles","title":"A quantile is one more model, with the pinball loss as its objective"},"level":"apply","pool":"practice"},{"id":"q-zero-shot-meaning-01","type":"single","prompt":"A team runs a pretrained forecaster \"zero-shot\" on its 500 sales series. What does zero-shot mean here?","options":[{"key":"A","text":"The model was trained on the 500 series for zero epochs after loading"},{"key":"B","text":"The model needs no history of a series to forecast it"},{"key":"C","text":"The model forecasts each series from its history without being trained on the team’s data"},{"key":"D","text":"The model gives point forecasts only"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Zero-shot use means no fitting or fine-tuning on your series. The publisher pretrained the model on other data; you pass each series’ recent history as context and read the forecast.","misconceptions":["Describes a training run of no length: zero-shot involves no training step on the data at all","Removes the context: the recent history of the series is the input the model forecasts from","","Confuses the way of use with the kind of output: these models return quantiles"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"what-pretraining-buys","title":"A forecaster trained on other people's series, used on yours as it is"},"level":"understand","pool":"practice"},{"id":"q-licence-gate-01","type":"single","prompt":"A utility compares two pretrained forecasters for its weekly operations. Model X: skill 0.18, weights under CC BY-NC 4.0. Model Y: skill 0.15, weights under Apache-2.0. The licences were read from the model cards today. What should the scorecard record?","options":[{"key":"A","text":"X is chosen: it is more accurate, and licences only matter when a model is sold"},{"key":"B","text":"Both are usable, because both sets of weights can be downloaded freely"},{"key":"C","text":"Neither: a pretrained model cannot be used without a paid contract"},{"key":"D","text":"Y is the candidate: the licence of X does not permit this use, whatever X scores"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A non-commercial licence rules the model out for a company’s operations. The licence is a gate applied before accuracy is compared, and the scorecard records the licence with the date it was read.","misconceptions":["Narrows \"commercial use\" to selling the model: running a company’s operations on it is commercial use","Confuses being able to download with being permitted to use","Invents a requirement: Apache-2.0 permits commercial use without a contract",""],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"read-the-model-card","title":"The licence is on the model card, and it is not the same for every family"},"level":"analyze","pool":"practice"},{"id":"q-retraining-schedule-01","type":"single","prompt":"A global model forecasts the industrial feeders 28 days ahead every week. A replay of one year, scored on the same 48 origins: retrained weekly (48 trainings) 0.719; every 4 weeks (12) 0.720; every 13 weeks (4) 0.719; once (1) 0.719. The worst single week against a model trained that week: 0.032 every 4 weeks, 0.032 every 13 weeks, 0.114 once. The planner accepts no week more than 0.05 worse than a fresh model. Which schedule is the defensible choice?","options":[{"key":"A","text":"Every week, because the newest model has seen the most recent data"},{"key":"B","text":"Every 13 weeks, because it meets the limit with fewest trainings"},{"key":"C","text":"Once, because its yearly error equals that of every other schedule"},{"key":"D","text":"Every 4 weeks, because monthly retraining is the usual practice"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Mean errors that differ by 0.001 are a tie. Of the schedules whose worst week stays within the planner's 0.05, every 13 weeks needs the fewest trainings; the once-a-year model has one week 0.114 worse than a fresh model.","misconceptions":["Assumes fresher is always better: 48 trainings bought no lower error in this replay","","Reads the yearly mean only: one week of the frozen model breaks the planner's limit","Follows a habit instead of the replay: the same worst week costs three times the trainings"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"retraining-schedules","title":"Retraining every week bought nothing this model needed"},"level":"evaluate","pool":"practice"},{"id":"q-centred-average-01","type":"single","prompt":"A notebook forecasts daily sales 14 days ahead. One feature is \"the 7-day centred moving average of sales on the target day\". The backtest score is far better than any other model’s. What is the fault?","options":[{"key":"A","text":"A 7-day average is too short to be a useful feature"},{"key":"B","text":"The average includes the target day and the three days after it"},{"key":"C","text":"Moving averages should not be used with tree models"},{"key":"D","text":"The feature should be scaled before training"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A centred average of day t uses days t-3 to t+3. It contains the value being forecast. A feature built from the target must end at least one horizon before the day it describes.","misconceptions":["Judges the usefulness of the feature: the problem is what it contains, not its length","","Invents a rule about model families: the fault would be the same in any model","Proposes a transformation: scaling a leaking feature leaves the leak in place"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"feature-sees-the-future","title":"A centred average contains the days being forecast"},"level":"analyze","pool":"practice"},{"id":"q-lag-shorter-than-horizon-01","type":"single","prompt":"A model forecasts every one of the next 28 days from a single origin. Which lag of the target can be used as a feature for all 28 days without leakage?","options":[{"key":"A","text":"Lag 1: the value of the day before the target day"},{"key":"B","text":"Lag 7: the value one week before the target day"},{"key":"C","text":"Lag 14: the value two weeks before the target day"},{"key":"D","text":"Lag 28: the value four weeks before the target day"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"For the last target, 28 days after the origin, a lag of 28 points at the origin day itself: the latest value that is known. Any shorter lag points past the origin for some of the 28 targets.","misconceptions":["For the second day ahead, the day before lies after the origin","For targets more than 7 days ahead, one week before lies after the origin","For targets more than 14 days ahead, two weeks before lies after the origin",""],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"feature-sees-the-future","title":"A centred average contains the days being forecast"},"level":"apply","pool":"practice"},{"id":"q-regressor-archive-01","type":"single","prompt":"A backtest of a demand model uses the temperature measured on each test day as a regressor. In production the model will receive a weather forecast. What does the backtest score measure?","options":[{"key":"A","text":"The accuracy the model would have with a perfect weather forecast"},{"key":"B","text":"The accuracy the model will have in production"},{"key":"C","text":"Nothing: a backtest with a regressor is never valid"},{"key":"D","text":"The accuracy of the weather forecast"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With measured temperature the model is handed information nobody had on the origin day. The score is an upper bound on what the model could do with perfect weather knowledge, not an estimate of its performance.","misconceptions":["","Takes the backtest for production: there the temperature is a forecast with its own error","Rejects all regressors: those known at the origin, such as the calendar, are valid","Reverses the roles: no weather forecast was used in the backtest at all"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"regressor-from-the-future","title":"The measured temperature of the test days was never available"},"level":"analyze","pool":"practice"},{"id":"q-selection-tuning-01","type":"single","prompt":"An analyst tries 30 settings of a model. For each she computes the scaled error on the 13 test folds and reports the lowest: 0.62. All features pass a known-at-the-origin test. Which statement about the 0.62 is right?","options":[{"key":"A","text":"It is honest, because no feature uses the future"},{"key":"B","text":"It is too high, because the best setting was not tuned further"},{"key":"C","text":"It is likely too low: the best of 30 on the test folds is partly luck"},{"key":"D","text":"It cannot be judged without the pinball loss"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Among 30 settings some score well on these folds by chance. Reporting the minimum counts that luck as skill. Choose the setting on folds before the test period, then score it once on the test folds.","misconceptions":["Checks the columns only: the setting was chosen with the test results","Asks for more tuning on the same folds, which would flatter the score more","","Changes the measure: the same fault applies to any score"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"selection-on-the-test-window","title":"The best setting in every test fold is known only afterwards"},"level":"analyze","pool":"practice"},{"id":"q-memo-content-01","type":"single","prompt":"You reviewed a colleague’s backtest and found two faults. After fixing both, the score moved from 0.30 to 0.74 against a floor of 1.05. What should the review memo report?","options":[{"key":"A","text":"That the model does not work, since its true score is more than twice the claimed one"},{"key":"B","text":"Each fault, where it was, its fix and the score after it, and 0.74 against the floor as the result"},{"key":"C","text":"The corrected score of 0.74 only, to avoid embarrassing the colleague"},{"key":"D","text":"The original score of 0.30 with a footnote that it may be optimistic"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A review memo names each fault, its location and fix, and the score before and after, and ends with the one number to report. Here the corrected model still beats the floor by about 30%.","misconceptions":["Judges the model by the size of the correction: 0.74 still beats the floor of 1.05","","Hides the findings: the next notebook will repeat faults nobody was told about","Keeps a number known to be wrong as the headline"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"the-review-memo","title":"The memo reports every fault with the score before and after"},"level":"apply","pool":"practice"},{"id":"q-leak-test-limits-01","type":"single","prompt":"A repository has an automated test: it changes every value after the forecast origin and checks that no feature column changes. The test passes. Which fault can still be present?","options":[{"key":"A","text":"The best of several models was picked using the test folds"},{"key":"B","text":"A feature that is a centred moving average of the target"},{"key":"C","text":"A regressor that uses measured weather of the target days"},{"key":"D","text":"A lag of 7 days used for a 28-day horizon"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The test inspects columns. Selection on the test window is a fault in how results were used to make a choice; no column shows it. It is found by asking how each setting or model was chosen.","misconceptions":["","Would be caught: its values near the origin change when later values change","Would be caught: the regressor changes when values after the origin change","Would be caught: for later targets the lag reads days after the origin"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"a-test-for-leaking-columns","title":"Change the future, and see which columns change with it"},"level":"understand","pool":"practice"},{"id":"q-pooling-level-01","type":"single","prompt":"A new site has averaged 50 units a day over its first four weeks. Similar older sites, at this time last year, ran at 0.90 of their own recent level in the following week. What is the pooled forecast for the new site’s next week, per day?","options":[{"key":"A","text":"50 units"},{"key":"B","text":"The average of the older sites’ demand"},{"key":"C","text":"55.6 units"},{"key":"D","text":"45 units"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pooling borrows the shape (0.90 of the recent level) from similar series and applies it to the new series’ own level: 0.90 × 50 = 45.","misconceptions":["Repeats the level: ignores the seasonal change the older sites went through","Uses the wrong level: the older sites’ size says nothing about this site","Divides by the ratio where it should multiply",""],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"borrow-the-shape","title":"Borrow the shape from similar feeders; keep your own level"},"level":"apply","pool":"practice"},{"id":"q-short-series-evidence-01","type":"single","prompt":"On 12 new series and one fold of 28 days, method P scores 0.92 and method Q scores 0.95. With half the history, Q scores 0.85. What is the soundest conclusion for the planner’s note?","options":[{"key":"A","text":"Q with half the history is the best method and should be used"},{"key":"B","text":"P is better than Q by 3%"},{"key":"C","text":"P and Q cannot be told apart on this evidence; say so, and review as data arrives"},{"key":"D","text":"Neither method works on short series"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One fold of 12 series is thin. A method that improves when given less data signals noise in the sample. The note should state the evidence as it is and name a review date.","misconceptions":["Takes a noisy improvement as real: a method does not gain from less data","Reads a small gap on 336 values as a ranking","","Dismisses both: each has a measured error that the note can report"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"short-history-comparison","title":"The methods that borrow from other series come first"},"level":"analyze","pool":"practice"},{"id":"q-fan-chart-reading-01","type":"single","prompt":"A fan chart shows a median line, a dark band labelled \"8 days in 10\" and a light band labelled \"19 days in 20\". A buyer must rarely be short of energy. Which part of the chart should the buyer plan on?","options":[{"key":"A","text":"The median line, because it is the most likely value"},{"key":"B","text":"The upper edge of a band, chosen by how rarely being short is acceptable"},{"key":"C","text":"The lower edge of the dark band, to avoid buying too much"},{"key":"D","text":"The middle of the light band"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The upper edge of the dark band is exceeded on about 1 day in 10, that of the light band on about 1 in 40. The buyer picks the edge that matches the cost of being short.","misconceptions":["Plans on the centre: demand is above the median on half of the days","","Protects against the cheaper error: being short is the costly one here","Returns to the centre by another name"],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"the-fan-chart","title":"The planner's picture: where demand is expected, and how sure we are"},"level":"understand","pool":"practice"},{"id":"q-note-limits-01","type":"single","prompt":"A forecast note covers the regional daily demand of the next 28 days. Its backtest used ordinary weather and the announced holiday calendar. Which sentence is a correct entry for the \"limits\" part?","options":[{"key":"A","text":"\"The forecast is accurate to within 5%.\""},{"key":"B","text":"\"The model uses ARIMA errors and Fourier terms.\""},{"key":"C","text":"\"Use with caution.\""},{"key":"D","text":"\"In a declared heat wave, ask for a rerun; do not use it for a single feeder.\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A limit names a situation in which the forecast should not be used, or should be rerun, and tells the reader what to do. Each limit should trace back to something the backtest did or did not measure.","misconceptions":["States an accuracy claim: that belongs to the evidence part, and it is not a limit","Describes the method: that belongs to the source part","Names no situation and no action: the reader cannot act on it",""],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"when-not-to-use-it","title":"Say when the forecast should not be used"},"level":"apply","pool":"practice"},{"id":"q-origin-moves-01","type":"single","prompt":"In a defence, the assessor says: \"Your backtest scored the 14-day horizon. The planner now needs 56 days. What changes?\" Which answer is the strongest?","options":[{"key":"A","text":"\"The backtest is rerun at 56 days: the floor, the scores and the width of the bands are measured again, and the features must be known 56 days ahead.\""},{"key":"B","text":"\"Nothing: the same model forecasts 56 days by running it four times.\""},{"key":"C","text":"\"The bands are multiplied by four.\""},{"key":"D","text":"\"A more complex model is needed for long horizons.\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Evidence holds for the horizon it was measured at. A new horizon changes which features are known at the origin, what the floor scores, and how wide the bands must be: all are measured by rerunning the backtest.","misconceptions":["","Assumes the evidence carries over: no score was measured at 56 days","Scales the uncertainty by a guess: error growth with the horizon is measured, not assumed","Changes the model before measuring whether the present one fails"],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"capstone-brief","title":"Your capstone: a dataset, a planner's request, three families, one note"},"level":"analyze","pool":"practice"},{"id":"q-average-quantiles-01","type":"single","prompt":"Three methods have 80% intervals that cover 84%, 79% and 64% of days. The method with 64% coverage has the best point forecast. The three are averaged quantile by quantile, and the average covers 82% with the lowest pinball loss of all four. What explains this?","options":[{"key":"A","text":"Averaging always improves coverage"},{"key":"B","text":"The pinball loss does not depend on the point forecast"},{"key":"C","text":"The average keeps most of the good centre and takes its width from the wider intervals"},{"key":"D","text":"The average covers 82% because 82 is close to the mean of 84, 79 and 64"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The pinball loss rewards a good centre and edges at the right distance. The average inherits a centre close to the best method’s and edges widened by the two better-calibrated methods.","misconceptions":["States a rule: three intervals that are all too narrow would average to one that is too narrow","Separates what the measure joins: the median is one of the scored quantiles","","Treats coverage as something that averages: the mean of the three is about 76"],"lo":["LO3"],"day":4,"session":3,"slide":{"deck":"day4","id":"average-the-quantiles","title":"On the quantiles the average is the best row of the table"},"level":"analyze","pool":"practice"}]}</script>
