<section>
<h2>Day 1: Look, frame and set the floor</h2>
<ol>
<li><p>A planner writes: "Send me next month's demand for Al-Sahil by Thursday." Being short costs her four times what being long costs. What does the desk reply with first?</p><ul><li><b>A.</b> The most accurate model's mean forecast for each day</li><li><b>B.</b> One number for the month, the average of the last three years</li><li><b>C.</b> The frame: daily or monthly, which decision, and the 80th percentile</li><li><b>D.</b> The figure in the annual budget, so the two stay consistent</li></ul></li>
<li><p>A model with a 365-day season forecasts Al-Rimal for spring 2026. It is far too high on a few days in March and too low on a few in early April. What is the likely cause?</p><ul><li><b>A.</b> Eid al-Fitr moved about 11 days earlier than in 2025</li><li><b>B.</b> Spring weather is more variable than summer weather</li><li><b>C.</b> The weekend is Friday and Saturday, not Saturday and Sunday</li><li><b>D.</b> Demand grew faster in 2026 than the model assumed</li></ul></li>
<li><p>You decompose a region's log demand with weekly and annual periods. The remainder is near zero on average, but about -0.12 on the same ten days every year: the days around the two Eids. What do you conclude?</p><ul><li><b>A.</b> The annual season needs a longer smoothing window</li><li><b>B.</b> The fit should be made robust so these days are ignored</li><li><b>C.</b> The series should be decomposed without the logarithm</li><li><b>D.</b> The effect is real and regular, and needs a regressor of its own</li></ul></li>
<li><p>A colleague reports a floor for a 28-day daily forecast: seasonal naive with m = 7, tested on the 28 days after one origin in January, error 0.28 after scaling. What is the main weakness?</p><ul><li><b>A.</b> The scale should come from the test days, not the training days</li><li><b>B.</b> One origin in a calm month says little about the other eleven</li><li><b>C.</b> A seasonal naive forecast is too simple to count as a floor</li><li><b>D.</b> The horizon should be shortened to 7 days to match m = 7</li></ul></li>
<li><p>A water utility backtests three naive forecasts of daily consumption over 12 rolling origins with a 14-day horizon. Scaled errors: last day 1.40, same weekday last week 0.95, same weekday 52 weeks ago 1.20. Which one is the benchmark floor for this series?</p><ul><li><b>A.</b> The last day, because it uses the newest value</li><li><b>B.</b> The same weekday last week, at 0.95</li><li><b>C.</b> The same weekday 52 weeks ago, as for electricity</li><li><b>D.</b> The mean of the three, at about 1.18</li></ul></li>
<li><p>You must test a 28-day forecast on the last 168 days of a series, so that every one of those days is tested exactly once. How many rolling origins do you need, and how far apart?</p><ul><li><b>A.</b> 168 origins, one day apart</li><li><b>B.</b> 1 origin, 168 days before the end</li><li><b>C.</b> 24 origins, 7 days apart</li><li><b>D.</b> 6 origins, 28 days apart</li></ul></li>
<li><p>On the test days a forecast for one feeder has a mean absolute error of 9 MWh. Inside the training data, the weekly seasonal naive forecast had a mean absolute error of 6 MWh. What is the scaled error, and what does it say?</p><ul><li><b>A.</b> 1.5: the forecast errs 1.5 times as much as last week's value did in training</li><li><b>B.</b> 0.67: the forecast is a third better than the seasonal naive forecast</li><li><b>C.</b> 3 MWh: the forecast is 3 MWh worse than the seasonal naive forecast</li><li><b>D.</b> 1.5: the forecast is wrong by 150% of demand on an average day</li></ul></li>
<li><p>After decomposing a region's log demand, the remainder has variance 0.002 and the annual season plus the remainder has variance 0.010. What is the strength of the annual season?</p><ul><li><b>A.</b> 0.20</li><li><b>B.</b> 0.50</li><li><b>C.</b> 0.80</li><li><b>D.</b> 5.00</li></ul></li>
<li><p>A district-cooling plant's daily load has doubled in five years. Its summer peak was 300 MWh above the winter level five years ago and is 600 MWh above it now. How should you decompose the series?</p><ul><li><b>A.</b> Decompose the load itself, with a longer trend window</li><li><b>B.</b> Decompose the last year only, where the swing is constant</li><li><b>C.</b> Decompose the load without an annual season</li><li><b>D.</b> Decompose the logarithm of the load</li></ul></li>
<li><p>You plot six years of daily demand for a commercial district as one line. You see growth and a summer peak, and nothing else. A colleague says the district has no weekly pattern. What do you do before agreeing?</p><ul><li><b>A.</b> Plot four weeks of daily values and compute the mean of each weekday</li><li><b>B.</b> Plot monthly totals, where patterns are easier to see</li><li><b>C.</b> Agree, since six years of data would show a weekly pattern</li><li><b>D.</b> Fit a model with a weekly season and see whether it runs</li></ul></li>
<li><p>A hospital orders oxygen one week ahead. Each unit short costs 3 times what each unit left over costs. The forecast desk can deliver any quantile of next week's use. Which one should the hospital order?</p><ul><li><b>A.</b> The 25th percentile</li><li><b>B.</b> The 50th percentile</li><li><b>C.</b> The 75th percentile</li><li><b>D.</b> The 99th percentile</li></ul></li>
<li><p>A planner needs a forecast for each of the next 14 days. The meter data reaches the forecast desk 3 days late. How many steps ahead of its last observation must the model forecast to cover the last day the planner needs?</p><ul><li><b>A.</b> 11 steps</li><li><b>B.</b> 14 steps</li><li><b>C.</b> 17 steps</li><li><b>D.</b> 42 steps</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Statistical forecasters</h2>
<ol>
<li><p>A method scores 1.3 on a region in the course's backtest. The floor scores 1.06. A colleague says: "Above 1, so it is worse than a naive forecast and useless." What is the right reading?</p><ul><li><b>A.</b> Right: any score above 1 loses to the naive forecast</li><li><b>B.</b> It loses to the floor, because 1.3 is above 1.06</li><li><b>C.</b> It is wrong by 130% of demand on an average day</li><li><b>D.</b> Nothing can be said: the measure does not work at 28 days</li></ul></li>
<li><p>An ETS model with a weekly season forecasts a hot region's daily demand 28 days ahead. Its fitted alpha is 0.99 and it scores 1.6 against a floor of 1.1. Which change is most likely to bring it under the floor?</p><ul><li><b>A.</b> Set alpha to 0.3 by hand for a smoother level</li><li><b>B.</b> Add a damped trend to the weekly model</li><li><b>C.</b> Train on nine years, not three</li><li><b>D.</b> Remove the annual season by decomposition before smoothing</li></ul></li>
<li><p>A seasonal ARIMA is fitted to three years of daily demand. The Ljung-Box p-value of its residuals is 0.0003 and its backtest score is close to the floor. What do you do next?</p><ul><li><b>A.</b> Look for the pattern left in the residuals and give the model a term for it</li><li><b>B.</b> Report the model: a p-value this small shows the fit is significant</li><li><b>C.</b> Rerun the test with more lags until it passes</li><li><b>D.</b> Drop ARIMA and move to another model family</li></ul></li>
<li><p>You forecast a region's demand 28 days ahead with a regression with ARIMA errors. In the backtest, which of these regressors may be filled with its true values for the 28 test days?</p><ul><li><b>A.</b> The measured daily temperature</li><li><b>B.</b> The demand of the neighbouring region</li><li><b>C.</b> The first day of Eid al-Adha in the official calendar</li><li><b>D.</b> The spot price of energy on each day</li></ul></li>
<li><p>Model P: scaled error 0.75, its 80% interval covers 62% of days. Model Q: scaled error 0.80, its 80% interval covers 79%. The planner buys on the 0.8 quantile. What do you deliver?</p><ul><li><b>A.</b> Model P as it is: it has the lower error</li><li><b>B.</b> Model Q, or model P with intervals rebuilt from its backtest errors</li><li><b>C.</b> Model P with every interval doubled in width</li><li><b>D.</b> Neither: average the two scaled errors and report 0.775</li></ul></li>
<li><p>Simple exponential smoothing with alpha = 0.2 has a level of 100. The next observed value is 150. What is the new level, and what is the forecast for five days ahead?</p><ul><li><b>A.</b> Level 110, forecast 110</li><li><b>B.</b> Level 140, forecast 140</li><li><b>C.</b> Level 110, forecast 160</li><li><b>D.</b> Level 125, forecast 125</li></ul></li>
<li><p>A cooling plant's daily load is forecast 28 days ahead in April. An ETS model with a 7-day season is always too low in weeks 3 and 4, by a growing amount. The weekday pattern is forecast well. What is the most likely cause?</p><ul><li><b>A.</b> The smoothing weight alpha is too high</li><li><b>B.</b> The weekly season should be multiplicative</li><li><b>C.</b> The model has no annual season, so its level stays flat while load climbs</li><li><b>D.</b> The backtest has too few origins to judge</li></ul></li>
<li><p>Two ARIMA models are fitted to the same series. Ljung-Box p-values of their residuals: model 1 gives 0.48, model 2 gives 0.002. Their backtest scores are equal. Which statement is right?</p><ul><li><b>A.</b> Model 2 is better: its result is statistically significant</li><li><b>B.</b> Model 1 has residuals that look like noise; model 2 leaves a pattern unused</li><li><b>C.</b> The models are equal, because the backtest scores are equal</li><li><b>D.</b> Model 1 is overfitted, because its p-value is too high</li></ul></li>
<li><p>A colleague asks why annual sine and cosine columns may be given to a model for the 28 future days, when the measured temperature may not. What do you answer?</p><ul><li><b>A.</b> The sine and cosine columns are smoother than the temperature</li><li><b>B.</b> The model needs at least four regressors to be stable</li><li><b>C.</b> The temperature has too many missing values</li><li><b>D.</b> They depend on the date only, and every future date is known at the origin</li></ul></li>
<li><p>A regression with ARIMA errors is backtested twice on the same folds. With the future temperature as known at the origin it scores 0.80. With the temperature measured on each test day it scores 0.58. Which number goes in the report to the planner, and why?</p><ul><li><b>A.</b> 0.58, because it shows what the model can do</li><li><b>B.</b> 0.69, the mean of the two, as a fair compromise</li><li><b>C.</b> 0.80, because only that forecast could have been made at the origin</li><li><b>D.</b> 0.58, with a footnote that weather was assumed known</li></ul></li>
<li><p>A dynamic regression is given an Eid regressor. Over a year of backtest folds its scaled error falls from 0.90 to 0.88 overall. On the 11 Eid days it falls from 1.40 to 0.85. A reviewer says the regressor "adds 2%" and is not worth keeping. What is the better reading?</p><ul><li><b>A.</b> The reviewer is right: 0.02 is within noise</li><li><b>B.</b> The regressor removes about 40% of the error on the days it was built for</li><li><b>C.</b> The regressor should be dropped and the Eid days deleted from the test</li><li><b>D.</b> The gain proves the model is now right on every holiday</li></ul></li>
<li><p>In a backtest of 280 test days, the actual value fell inside a model's 80% interval on 182 days. What is the coverage, and what does it say about the interval?</p><ul><li><b>A.</b> 65%: the interval is too narrow</li><li><b>B.</b> 65%: the interval is too wide</li><li><b>C.</b> 80%: the interval is correct by construction</li><li><b>D.</b> 35%: the share of days outside the interval</li></ul></li>
<li><p>A forecast of the 0.8 quantile of tomorrow's demand is 500 MWh. Demand turns out to be 520 MWh. What is the pinball loss of this one forecast?</p><ul><li><b>A.</b> 4</li><li><b>B.</b> 10</li><li><b>C.</b> 16</li><li><b>D.</b> 20</li></ul></li>
<li><p>You rebuild a model's intervals from the errors of its backtest. For the fold with origin 1 July you use the errors of all 26 folds, including July to December of the same year. Coverage of the 80% interval comes out at exactly 80%. What is wrong?</p><ul><li><b>A.</b> Nothing: 80% is the target</li><li><b>B.</b> The errors should not be scaled before taking quantiles</li><li><b>C.</b> Too many folds were used: four are enough</li><li><b>D.</b> The interval uses errors made after its origin, so its coverage is flattered</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Many series and pretrained models</h2>
<ol>
<li><p>A regression forecasts daily demand 28 days ahead. Its backtest scores 0.55 with four regressors. Which one makes that score dishonest?</p><ul><li><b>A.</b> A column that is 1 on the days of Eid al-Fitr</li><li><b>B.</b> The day of the week of the target day</li><li><b>C.</b> The temperature measured on the target day</li><li><b>D.</b> Mean demand of the 28 days before the origin</li></ul></li>
<li><p>In one region the regional model scores 0.89 on the held-out weeks and the sum of the feeder forecasts scores 0.58 against the regional total. Purchasing and operations need one coherent set. Which is the defensible choice?</p><ul><li><b>A.</b> Bottom-up: here the feeder models carry the better information</li><li><b>B.</b> Top-down, because it won in Al-Dana</li><li><b>C.</b> Keep both base forecasts and let each department use its own</li><li><b>D.</b> Least squares, because it uses both levels</li></ul></li>
<li><p>A global model forecasts 28 days ahead from a table with one row per series, origin and horizon day. The analyst trains on all rows whose origin is before 1 June and tests at the origin of 1 June. The score is far better than any other's. What should be checked first?</p><ul><li><b>A.</b> Whether the training table has enough rows per series</li><li><b>B.</b> Whether the number of trees was tuned</li><li><b>C.</b> Whether the target was scaled per series</li><li><b>D.</b> Whether training rows have target days after 1 June</li></ul></li>
<li><p>A pretrained forecaster, zero-shot, has a skill of 0.10 on a fold of ordinary weeks and of -0.30 on a fold with a moving holiday. It was given 512 days of history and nothing else. Which conclusion is supported?</p><ul><li><b>A.</b> Pretrained forecasters do not work on energy demand</li><li><b>B.</b> It lacks the calendar: a baseline for ordinary weeks, not for holidays</li><li><b>C.</b> Its skill is -0.10 on average, so it is slightly worse than the floor</li><li><b>D.</b> It needs a longer context to learn the holiday</li></ul></li>
<li><p>Skill against the floor on 200 series: X 0.21, Y 0.20, Z 0.05. X is a pretrained model under a non-commercial licence. Y is a boosted model under a permissive licence. Z is the fastest. The forecasts will run a utility's weekly purchasing. Which family?</p><ul><li><b>A.</b> X: it has the highest skill</li><li><b>B.</b> Z: it is the fastest of the three</li><li><b>C.</b> Y: within 0.01 of the best, and its licence permits the use</li><li><b>D.</b> X now, and ask about the licence after the pilot</li></ul></li>
<li><p>A district has three substations. Their forecasts for tomorrow are 40, 25 and 15 MWh. A separate model for the district forecasts 90 MWh. Under bottom-up reconciliation, what are the reconciled forecasts?</p><ul><li><b>A.</b> Substations 40, 25 and 15; district 80</li><li><b>B.</b> Substations 45, 28.1 and 16.9; district 90</li><li><b>C.</b> Substations 40, 25 and 15; district 90</li><li><b>D.</b> Substations 42.5, 27.5 and 17.5; district 87.5</li></ul></li>
<li><p>A region has 4 feeders. The feeder forecasts for one day add up to 190 MWh and the regional model forecasts 200 MWh. Ordinary least squares reconciliation gives every feeder an equal part of the gap, gap / (n + 1). What is the reconciled regional total?</p><ul><li><b>A.</b> 200 MWh</li><li><b>B.</b> 190 MWh</li><li><b>C.</b> 198 MWh</li><li><b>D.</b> 195 MWh</li></ul></li>
<li><p>In a backtest of one hierarchy, top-down reconciliation raised the error of the lowest level from 0.65 to 0.88. The upper-level model scored 0.89 against the total, and the sum of the lower-level forecasts scored 0.58 against the same total. What explains the result?</p><ul><li><b>A.</b> Top-down always loses information about the lower level</li><li><b>B.</b> The upper-level model was the weaker one, and top-down spread its error downwards</li><li><b>C.</b> The lower-level forecasts were not coherent before reconciliation</li><li><b>D.</b> The scaled error cannot be compared across levels</li></ul></li>
<li><p>One boosted model is trained across 300 series whose daily means range from 20 to 4,000 units. Trained on the raw values, its scaled error is six times worse than when each series is divided by its own recent mean first. Why does the division help so much?</p><ul><li><b>A.</b> Boosted trees cannot handle values above 1,000</li><li><b>B.</b> Dividing removes the weekly season from each series</li><li><b>C.</b> The division shortens the training time</li><li><b>D.</b> Without it the trees spend their splits on the size of a series, not on its pattern</li></ul></li>
<li><p>Three boosted models are trained with the quantile objective for 0.1, 0.5 and 0.9. On held-out days, actual demand falls between the 0.1 and 0.9 forecasts on 71% of days. Which statement is right?</p><ul><li><b>A.</b> The interval is too narrow: it claims 8 days in 10 and holds on about 7</li><li><b>B.</b> The interval is well calibrated, because 71% is close to 0.9 minus 0.1</li><li><b>C.</b> The median model is biased</li><li><b>D.</b> The quantile models crossed</li></ul></li>
<li><p>A team runs a pretrained forecaster "zero-shot" on its 500 sales series. What does zero-shot mean here?</p><ul><li><b>A.</b> The model was trained on the 500 series for zero epochs after loading</li><li><b>B.</b> The model needs no history of a series to forecast it</li><li><b>C.</b> The model forecasts each series from its history without being trained on the team’s data</li><li><b>D.</b> The model gives point forecasts only</li></ul></li>
<li><p>A utility compares two pretrained forecasters for its weekly operations. Model X: skill 0.18, weights under CC BY-NC 4.0. Model Y: skill 0.15, weights under Apache-2.0. The licences were read from the model cards today. What should the scorecard record?</p><ul><li><b>A.</b> X is chosen: it is more accurate, and licences only matter when a model is sold</li><li><b>B.</b> Both are usable, because both sets of weights can be downloaded freely</li><li><b>C.</b> Neither: a pretrained model cannot be used without a paid contract</li><li><b>D.</b> Y is the candidate: the licence of X does not permit this use, whatever X scores</li></ul></li>
<li><p>A global model forecasts the industrial feeders 28 days ahead every week. A replay of one year, scored on the same 48 origins: retrained weekly (48 trainings) 0.719; every 4 weeks (12) 0.720; every 13 weeks (4) 0.719; once (1) 0.719. The worst single week against a model trained that week: 0.032 every 4 weeks, 0.032 every 13 weeks, 0.114 once. The planner accepts no week more than 0.05 worse than a fresh model. Which schedule is the defensible choice?</p><ul><li><b>A.</b> Every week, because the newest model has seen the most recent data</li><li><b>B.</b> Every 13 weeks, because it meets the limit with fewest trainings</li><li><b>C.</b> Once, because its yearly error equals that of every other schedule</li><li><b>D.</b> Every 4 weeks, because monthly retraining is the usual practice</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Review and communicate</h2>
<ol>
<li><p>On two held-out folds, method P scores 0.64 (0.75 and 0.53 by fold) and method Q scores 0.62 (0.73 and 0.51). P is a table lookup; Q needs a feature pipeline. What is the sound reading?</p><ul><li><b>A.</b> Q is the more accurate method and should replace P</li><li><b>B.</b> The gap is small beside the spread between folds: prefer the simpler P</li><li><b>C.</b> Two folds are too few to say anything about either method</li><li><b>D.</b> Q, because a trained model will improve as data arrives</li></ul></li>
<li><p>An analyst backtests four models on the 13 folds of 2025. Every feature and regressor passes a known-at-the-origin test. She reports: "Our forecast scores 0.70: for each fold we use the model that was most accurate on it." What should the review memo say?</p><ul><li><b>A.</b> Nothing: the features are clean, so the score stands</li><li><b>B.</b> Add more models, so that the best one per fold is better still</li><li><b>C.</b> The model was chosen on the test folds: choose on earlier folds and rescore</li><li><b>D.</b> Report the pinball loss in place of the scaled error</li></ul></li>
<li><p>A charging hub opened six weeks ago, in spring. Forty older hubs in the same city have two years of history and a clear summer rise. The planner needs the next four weeks. Which approach is the soundest starting point?</p><ul><li><b>A.</b> The older hubs' seasonal shape at this time of year, times the new hub's level</li><li><b>B.</b> A seasonal ARIMA with an annual season on the hub's six weeks</li><li><b>C.</b> The average demand of the forty older hubs</li><li><b>D.</b> No forecast until the hub has a full year of data</li></ul></li>
<li><p>A report says: "On the 2025 test folds the average of our four models scored 0.80. The best single model scored 0.76. We therefore deliver the best single model." What is the weakness of the argument?</p><ul><li><b>A.</b> The average should have used weights fitted on the 2025 folds</li><li><b>B.</b> Four models are too few for an average to work</li><li><b>C.</b> The scaled error cannot compare an average with a single model</li><li><b>D.</b> "Best" was read off the test folds: the choice was not available in advance</li></ul></li>
<li><p>A forecast's 80% band covered 71% of days in last year's backtest. The planner buys energy at the upper edge of that band. Which sentence should the note carry?</p><ul><li><b>A.</b> "Demand will be inside the band with a probability of 80%."</li><li><b>B.</b> "Last year the band held on 71 days in 100; it is narrower than its name."</li><li><b>C.</b> "The interval is approximately calibrated."</li><li><b>D.</b> "The band shows the uncertainty of the forecast."</li></ul></li>
<li><p>A notebook forecasts daily sales 14 days ahead. One feature is "the 7-day centred moving average of sales on the target day". The backtest score is far better than any other model’s. What is the fault?</p><ul><li><b>A.</b> A 7-day average is too short to be a useful feature</li><li><b>B.</b> The average includes the target day and the three days after it</li><li><b>C.</b> Moving averages should not be used with tree models</li><li><b>D.</b> The feature should be scaled before training</li></ul></li>
<li><p>A model forecasts every one of the next 28 days from a single origin. Which lag of the target can be used as a feature for all 28 days without leakage?</p><ul><li><b>A.</b> Lag 1: the value of the day before the target day</li><li><b>B.</b> Lag 7: the value one week before the target day</li><li><b>C.</b> Lag 14: the value two weeks before the target day</li><li><b>D.</b> Lag 28: the value four weeks before the target day</li></ul></li>
<li><p>A backtest of a demand model uses the temperature measured on each test day as a regressor. In production the model will receive a weather forecast. What does the backtest score measure?</p><ul><li><b>A.</b> The accuracy the model would have with a perfect weather forecast</li><li><b>B.</b> The accuracy the model will have in production</li><li><b>C.</b> Nothing: a backtest with a regressor is never valid</li><li><b>D.</b> The accuracy of the weather forecast</li></ul></li>
<li><p>An analyst tries 30 settings of a model. For each she computes the scaled error on the 13 test folds and reports the lowest: 0.62. All features pass a known-at-the-origin test. Which statement about the 0.62 is right?</p><ul><li><b>A.</b> It is honest, because no feature uses the future</li><li><b>B.</b> It is too high, because the best setting was not tuned further</li><li><b>C.</b> It is likely too low: the best of 30 on the test folds is partly luck</li><li><b>D.</b> It cannot be judged without the pinball loss</li></ul></li>
<li><p>You reviewed a colleague’s backtest and found two faults. After fixing both, the score moved from 0.30 to 0.74 against a floor of 1.05. What should the review memo report?</p><ul><li><b>A.</b> That the model does not work, since its true score is more than twice the claimed one</li><li><b>B.</b> Each fault, where it was, its fix and the score after it, and 0.74 against the floor as the result</li><li><b>C.</b> The corrected score of 0.74 only, to avoid embarrassing the colleague</li><li><b>D.</b> The original score of 0.30 with a footnote that it may be optimistic</li></ul></li>
<li><p>A repository has an automated test: it changes every value after the forecast origin and checks that no feature column changes. The test passes. Which fault can still be present?</p><ul><li><b>A.</b> The best of several models was picked using the test folds</li><li><b>B.</b> A feature that is a centred moving average of the target</li><li><b>C.</b> A regressor that uses measured weather of the target days</li><li><b>D.</b> A lag of 7 days used for a 28-day horizon</li></ul></li>
<li><p>A new site has averaged 50 units a day over its first four weeks. Similar older sites, at this time last year, ran at 0.90 of their own recent level in the following week. What is the pooled forecast for the new site’s next week, per day?</p><ul><li><b>A.</b> 50 units</li><li><b>B.</b> The average of the older sites’ demand</li><li><b>C.</b> 55.6 units</li><li><b>D.</b> 45 units</li></ul></li>
<li><p>On 12 new series and one fold of 28 days, method P scores 0.92 and method Q scores 0.95. With half the history, Q scores 0.85. What is the soundest conclusion for the planner’s note?</p><ul><li><b>A.</b> Q with half the history is the best method and should be used</li><li><b>B.</b> P is better than Q by 3%</li><li><b>C.</b> P and Q cannot be told apart on this evidence; say so, and review as data arrives</li><li><b>D.</b> Neither method works on short series</li></ul></li>
<li><p>A fan chart shows a median line, a dark band labelled "8 days in 10" and a light band labelled "19 days in 20". A buyer must rarely be short of energy. Which part of the chart should the buyer plan on?</p><ul><li><b>A.</b> The median line, because it is the most likely value</li><li><b>B.</b> The upper edge of a band, chosen by how rarely being short is acceptable</li><li><b>C.</b> The lower edge of the dark band, to avoid buying too much</li><li><b>D.</b> The middle of the light band</li></ul></li>
<li><p>A forecast note covers the regional daily demand of the next 28 days. Its backtest used ordinary weather and the announced holiday calendar. Which sentence is a correct entry for the "limits" part?</p><ul><li><b>A.</b> "The forecast is accurate to within 5%."</li><li><b>B.</b> "The model uses ARIMA errors and Fourier terms."</li><li><b>C.</b> "Use with caution."</li><li><b>D.</b> "In a declared heat wave, ask for a rerun; do not use it for a single feeder."</li></ul></li>
<li><p>In a defence, the assessor says: "Your backtest scored the 14-day horizon. The planner now needs 56 days. What changes?" Which answer is the strongest?</p><ul><li><b>A.</b> "The backtest is rerun at 56 days: the floor, the scores and the width of the bands are measured again, and the features must be known 56 days ahead."</li><li><b>B.</b> "Nothing: the same model forecasts 56 days by running it four times."</li><li><b>C.</b> "The bands are multiplied by four."</li><li><b>D.</b> "A more complex model is needed for long horizons."</li></ul></li>
<li><p>Three methods have 80% intervals that cover 84%, 79% and 64% of days. The method with 64% coverage has the best point forecast. The three are averaged quantile by quantile, and the average covers 82% with the lowest pinball loss of all four. What explains this?</p><ul><li><b>A.</b> Averaging always improves coverage</li><li><b>B.</b> The pinball loss does not depend on the point forecast</li><li><b>C.</b> The average keeps most of the good centre and takes its width from the wider intervals</li><li><b>D.</b> The average covers 82% because 82 is close to the mean of 84, 79 and 64</li></ul></li>
</ol>
